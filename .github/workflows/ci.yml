name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. rapid re-pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Both OSes to completion: claude-mv is all path handling, and the two
      # platforms differ in exactly the place that matters — macOS resolves
      # /var and /tmp through symlinks, Linux does not. That asymmetry is
      # what canonical() exists for, so it must be exercised on both.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # The Linux runner image ships no zsh, and claude-mv's wrapper — which
      # decides which profiles get migrated — is zsh. Without this the wrapper
      # layer skips here, silently, and the feature is only ever tested on one
      # of the two platforms.
      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      # `zsh --version` without a `|| true`: the wrapper layer skips itself
      # when zsh is absent, and a skip is quiet — so a runner image that drops
      # zsh would take a whole layer with it and leave the build green. Failing
      # here is the guard.
      - name: Tool versions
        run: |
          python3 --version
          zsh --version

      - name: Run test suite
        # Hermetic by default: the live layers need CLAUDE_MV_LIVE_TEST=1 and
        # the conformance layer needs a real ~/.claude, so both skip on CI.
        # Everything else runs against tmpdirs with the restore root
        # redirected — no network, no claude binary, nothing outside the
        # runner's temp space.
        run: python3 tests/test_claude_mv.py -v
